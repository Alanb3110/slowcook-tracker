<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CuissonTracker">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <title>CuissonTracker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#08090b;
      --surface:#121419;
      --surface2:#181b21;
      --surface3:#20242b;
      --text:#f5f5f7;
      --muted:#8e8e93;
      --line:rgba(255,255,255,.10);
      --blue:#0a84ff;
      --green:#30d158;
      --orange:#ff9f0a;
      --red:#ff453a;
      --yellow:#ffd60a;
      --cyan:#64d2ff;
      --purple:#bf5af2;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
    body{padding:calc(var(--safe-top) + 8px) 0 calc(var(--safe-bottom) + 88px);overscroll-behavior-y:none}
    button,input,select,textarea{font:inherit}
    button{border:0;color:inherit}
    .app{max-width:760px;margin:0 auto;padding:0 14px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 12px;position:sticky;top:var(--safe-top);z-index:10;background:linear-gradient(var(--bg) 80%,transparent)}
    .brand{font-size:22px;font-weight:800;letter-spacing:-.02em}.brand small{font-size:11px;color:var(--muted);font-weight:600;vertical-align:middle}
    .icon-btn{width:42px;height:42px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:20px;border:1px solid var(--line)}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
    .hero{padding:18px}
    .eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
    h1,h2,h3,p{margin:0}
    .cook-title{font-size:21px;font-weight:760;margin-top:4px;line-height:1.18}
    .meta{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.35}
    .temperature-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:22px}
    .current-temp{font-size:64px;line-height:.9;font-weight:800;letter-spacing:-.055em;white-space:nowrap}
    .current-temp small{font-size:25px;font-weight:650;color:var(--muted);letter-spacing:0}
    .target-block{text-align:right;padding-bottom:4px}
    .target-value{font-size:23px;font-weight:760}.target-label{font-size:12px;color:var(--muted);margin-top:2px}
    .progress{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:20px}.progress>div{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .25s}
    .stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
    .stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:92px}
    .stat-label{color:var(--muted);font-size:12px;margin-bottom:6px}.stat-value{font-size:19px;font-weight:760;line-height:1.15}.stat-detail{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.3}
    .quality-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-title{font-size:16px;font-weight:760}.section-action{font-size:13px;color:var(--blue);background:transparent;padding:7px 0}
    .chart-wrap{position:relative;width:100%;height:270px}.chart-wrap canvas{width:100%;height:100%;display:block;touch-action:none}
    .chart-legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:7px;font-size:11px;color:var(--muted)}.chart-legend .temp-key::before,.chart-legend .velocity-key::before{content:'';display:inline-block;width:15px;height:3px;border-radius:3px;vertical-align:middle;margin-right:6px;background:var(--blue)}.chart-legend .velocity-key::before{background:var(--cyan)}.velocity-toggle{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:7px 10px;font-size:11px;color:var(--muted);cursor:pointer}.velocity-toggle.active{color:var(--cyan);border-color:rgba(100,210,255,.5);background:rgba(100,210,255,.10)}.chart-note{font-size:11px;color:var(--muted);line-height:1.35;margin-top:7px}
    .range-row{display:flex;gap:7px;overflow:auto;padding-top:10px}.chip{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:12px;color:var(--muted);white-space:nowrap}.chip.active{background:rgba(10,132,255,.18);border-color:rgba(10,132,255,.45);color:#fff}
    .empty{padding:44px 18px;text-align:center}.empty-icon{font-size:44px;margin-bottom:12px}.empty h2{font-size:24px;margin-bottom:8px}.empty p{color:var(--muted);font-size:14px;line-height:1.45;max-width:430px;margin:0 auto 20px}
    .primary{background:var(--blue);border-radius:16px;padding:14px 18px;font-weight:760;font-size:16px;width:100%}.secondary{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 15px;font-weight:650}.danger{background:rgba(255,69,58,.14);color:#ff6961;border:1px solid rgba(255,69,58,.25)}
    .measure-list{display:flex;flex-direction:column;gap:8px}.measure-item{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:10px;background:var(--surface2);border-radius:14px;padding:11px 12px}.measure-time{font-size:13px;color:var(--muted)}.measure-temp{font-size:18px;font-weight:730}.mini-btn{background:var(--surface3);border:1px solid var(--line);border-radius:11px;padding:7px 10px;font-size:12px}
    .event-pill{font-size:11px;border-radius:99px;padding:5px 8px;background:rgba(191,90,242,.13);color:#d7a8ff;display:inline-block;margin-top:4px}
    .bottom-bar{position:fixed;left:0;right:0;bottom:0;padding:9px 14px calc(var(--safe-bottom) + 9px);background:rgba(8,9,11,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:20}
    .bottom-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1.45fr 1fr;gap:9px}.nav-btn{height:54px;border-radius:17px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:13px}.nav-btn.main{background:var(--blue);font-size:15px;border-color:transparent}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:flex-end;z-index:100;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}.modal.open{display:flex}.sheet{width:100%;max-width:760px;margin:0 auto;background:#111319;border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:14px 16px calc(var(--safe-bottom) + 18px);max-height:90vh;overflow:auto;animation:up .18s ease-out}@keyframes up{from{transform:translateY(15px);opacity:.7}to{transform:none;opacity:1}}
    .handle{width:40px;height:5px;border-radius:99px;background:#4a4d54;margin:0 auto 16px}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.sheet-title{font-size:20px;font-weight:800}.close{background:var(--surface3);width:34px;height:34px;border-radius:50%;font-size:17px}
    .field{margin-bottom:14px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:650;margin:0 0 6px 2px}.field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:14px;color:var(--text);padding:13px 14px;outline:none;font-size:16px}.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(10,132,255,.65);box-shadow:0 0 0 3px rgba(10,132,255,.12)}.field textarea{resize:vertical;min-height:88px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:9px;margin-top:18px}.actions>*{flex:1}.hint{font-size:12px;color:var(--muted);line-height:1.4;margin-top:8px}.error{color:#ff6961;font-size:12px;min-height:16px;margin:4px 2px 0}
    .menu-list{display:flex;flex-direction:column;gap:8px}.menu-item{background:var(--surface2);border:1px solid var(--line);border-radius:15px;padding:14px;text-align:left}.menu-item strong{display:block;font-size:15px}.menu-item span{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.3}
    .history-item{background:var(--surface2);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:8px}.history-top{display:flex;justify-content:space-between;gap:10px}.history-title{font-weight:730}.history-sub{color:var(--muted);font-size:12px;margin-top:4px}.history-actions{display:flex;gap:7px;margin-top:10px}.history-actions button{flex:1}
    .toast{position:fixed;left:50%;bottom:calc(var(--safe-bottom) + 92px);transform:translateX(-50%) translateY(15px);background:#2b2e35;color:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:13px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:200;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .hidden{display:none!important}.sep{height:1px;background:var(--line);margin:14px 0}.small{font-size:12px;color:var(--muted)}
    .analysis-details{font-size:12px;color:var(--muted);line-height:1.55}.analysis-details summary{cursor:pointer;color:var(--blue);padding:3px 0}.analysis-details table{width:100%;border-collapse:collapse;margin-top:8px}.analysis-details td,.analysis-details th{padding:5px;text-align:left;border-bottom:1px solid var(--line)}.analysis-details td:last-child{text-align:right}.warning{color:var(--orange)}
    @media (min-width:650px){.stat-grid{grid-template-columns:repeat(4,1fr)}.sheet{border-radius:26px;margin-bottom:18px;border-bottom:1px solid var(--line)}.modal{align-items:center}.chart-wrap{height:330px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">CuissonTracker <small>v3.2.3</small></div>
      <button class="icon-btn" id="historyTopBtn" aria-label="Historique">☰</button>
    </header>
    <main id="main"></main>
  </div>

  <nav class="bottom-bar" id="bottomBar">
    <div class="bottom-inner">
      <button class="nav-btn" id="eventBtn">＋ Événement</button>
      <button class="nav-btn main" id="addBtn">＋ Mesure</button>
      <button class="nav-btn" id="moreBtn">••• Plus</button>
    </div>
  </nav>

  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
  <input id="fileInput" type="file" accept="application/json,.json" hidden>

<script src="analysis.js?v=4.2.2"></script>
<script>
'use strict';

// CuissonTracker Web v3.2.3 — local phase analysis v4.2.2
// Data schema kept compatible with the Scriptable schema v5.

const APP_VERSION = '3.2.3';
const ANALYSIS_VERSION = 'web-4.2.2';
const SCHEMA_VERSION = 5;
const STORAGE_KEY = 'cuissonTracker.state.v5';
const MIN_TEMP_C = -20;
const MAX_TEMP_C = 350;
const DEFAULT_TARGET_C = 93;

const FOOD_GROUPS = [
  ['Bœuf',['Jarret de bœuf','Paleron de bœuf','Basse-côte de bœuf','Poitrine / brisket de bœuf','Rôti de bœuf','Côte / entrecôte de bœuf']],
  ['Agneau',['Épaule d’agneau','Gigot d’agneau','Jarret d’agneau','Poitrine d’agneau']],
  ['Porc',['Épaule de porc / pulled pork','Travers de porc','Poitrine de porc','Rôti de porc','Jambon']],
  ['Volaille',['Poulet entier','Cuisses de poulet','Blancs de poulet','Dinde','Canard']],
  ['Poisson',['Poisson entier','Filet de poisson','Saumon','Fruits de mer']],
  ['Végétal / autre',['Légumes','Pommes de terre','Pain / pâte','Plat mijoté','Autre plat']]
];
const EVENT_TYPES = [
  ['wrapped','Emballé'],['unwrapped','Déballé'],['setpointChanged','Consigne modifiée'],['addedLiquid','Liquide ajouté'],['probeMoved','Sonde déplacée'],['longOpening','Ouverture prolongée'],['note','Note']
];
const PHASE_BOUNDARY_TYPES = new Set(['wrapped','unwrapped','setpointChanged','addedLiquid','probeMoved','longOpening']);

let state = loadState();
let chartRangeMinutes = 180;
let velocityVisible = true;
let chartView = null;
let toastTimer = null;

function emptyState(){return {schemaVersion:SCHEMA_VERSION,activeCooking:null,archivedCookings:[],updatedAt:localISOString(new Date())};}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return emptyState();
    return migrateState(JSON.parse(raw));
  }catch(e){console.error(e);return emptyState();}
}
function migrateState(input){
  const s=input&&typeof input==='object'?input:emptyState();
  const out={schemaVersion:SCHEMA_VERSION,activeCooking:s.activeCooking||null,archivedCookings:Array.isArray(s.archivedCookings)?s.archivedCookings:[],updatedAt:s.updatedAt||localISOString(new Date())};
  for(const c of [out.activeCooking,...out.archivedCookings].filter(Boolean)) normalizeCooking(c);
  return out;
}
function normalizeCooking(c){
  c.measurements=Array.isArray(c.measurements)?c.measurements:[];
  c.events=Array.isArray(c.events)?c.events:[];
  c.predictionLog=Array.isArray(c.predictionLog)?c.predictionLog:[];
  if(c.initialCookerSetpointC===undefined)c.initialCookerSetpointC=c.cookerSetpointC??null;
  if(c.cookerSetpointC===undefined)c.cookerSetpointC=c.initialCookerSetpointC??null;
  c.measurements=c.measurements.map(m=>({timestamp:m.timestamp||localISOString(new Date()),temperature:Number(m.temperature),source:m.source||'manual',comment:m.comment??null})).filter(m=>Number.isFinite(m.temperature));
  c.measurements.sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
  c.events.sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
}
function saveState(){
  state.schemaVersion=SCHEMA_VERSION;state.updatedAt=localISOString(new Date());
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
  catch(e){alert('Le stockage local est indisponible ou plein. Exporte une sauvegarde JSON.');throw e;}
}

function parseNumberFr(v){
  if(v===null||v===undefined)return NaN;
  const t=String(v).trim().replace(/\s+/g,'').replace(',','.');
  if(!t)return NaN;
  return Number(t);
}
function parseTemperature(v){const n=parseNumberFr(v);return Number.isFinite(n)&&n>=MIN_TEMP_C&&n<=MAX_TEMP_C?n:null;}
function parseOptional(v,min,max){if(String(v??'').trim()==='')return null;const n=parseNumberFr(v);return Number.isFinite(n)&&n>=min&&n<=max?n:undefined;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function round(v,n=1){const f=10**n;return Math.round((Number(v)+Number.EPSILON)*f)/f;}
function fmtTemp(v){if(!Number.isFinite(Number(v)))return '—';const r=round(v,1);return (Number.isInteger(r)?String(r):r.toFixed(1)).replace('.',',');}
function fmtNum(v,n=2){if(!Number.isFinite(Number(v)))return '';const r=round(v,n);return (Number.isInteger(r)?String(r):String(r)).replace('.',',');}
function pad2(v){return String(Math.trunc(v)).padStart(2,'0');}
function fmtClock(d){return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;}
function fmtDate(d){return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`;}
function fmtDateTime(d){return `${fmtDate(d)} à ${fmtClock(d)}`;}
function fmtDurationMin(min){if(!Number.isFinite(min))return '—';min=Math.max(0,Math.round(min));if(min<60)return `${min} min`;const h=Math.floor(min/60),m=min%60;return m?`${h} h ${pad2(m)}`:`${h} h`;}
function localISOString(date){const z=-date.getTimezoneOffset(),sgn=z>=0?'+':'-',a=Math.abs(z);return `${date.getFullYear()}-${pad2(date.getMonth()+1)}-${pad2(date.getDate())}T${pad2(date.getHours())}:${pad2(date.getMinutes())}:${pad2(date.getSeconds())}${sgn}${pad2(Math.floor(a/60))}:${pad2(a%60)}`;}
function toDatetimeLocal(iso){const d=new Date(iso);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;}
function fromDatetimeLocal(v){const d=new Date(v);return Number.isFinite(d.getTime())?localISOString(d):null;}
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function makeId(prefix='id'){return `${Date.now()}-${prefix}-${Math.random().toString(36).slice(2,8)}`;}
function safeName(s){return String(s||'cuisson').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,100)||'cuisson';}

function getSetpointAtTime(c,timeMs){
  let s=c.initialCookerSetpointC==null?NaN:Number(c.initialCookerSetpointC);
  if(!Number.isFinite(s))s=c.cookerSetpointC==null?NaN:Number(c.cookerSetpointC);
  const ev=[...(c.events||[])].filter(e=>e.type==='setpointChanged'&&new Date(e.timestamp).getTime()<=timeMs).sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
  for(const e of ev){const n=Number(e.details?.toC);if(Number.isFinite(n))s=n;}
  return Number.isFinite(s)?s:null;
}
function analyzeCooking(c){
  const now=c.endedAt?new Date(c.endedAt).getTime():Date.now();
  const analysis=TemperatureAnalysis.analyze(c,now);
  return {...analysis,setpoint:analysis.all.length?getSetpointAtTime(c,analysis.all.at(-1).timeMs):null};
}
function trendLabel(s){if(!Number.isFinite(s))return 'Tendance indisponible';if(s>8)return 'Montée rapide';if(s>2)return 'Montée';if(s>.5)return 'Montée lente';if(s>=-.5)return 'Quasi stable';return 'Température en baisse';}
function qualityColor(q){return q==='good'?'#30d158':q==='usable'?'#0a84ff':q==='stale'?'#ff9f0a':'#8e8e93';}

function render(){
  const main=document.getElementById('main'),bar=document.getElementById('bottomBar');
  if(!state.activeCooking){bar.classList.add('hidden');main.innerHTML=emptyHtml();return;}
  bar.classList.remove('hidden');const c=state.activeCooking,a=analyzeCooking(c),last=a.all.at(-1),target=Number(c.targetTemperature),current=last?.temperature;
  const pct=Number.isFinite(current)&&Number.isFinite(target)?clamp((current/target)*100,0,100):0;
  const meta=[c.foodType,Number.isFinite(Number(c.massKg))?`${fmtNum(c.massKg)} kg`:null,Number.isFinite(Number(c.maxThicknessCm))?`ép. ${fmtNum(c.maxThicknessCm)} cm`:null].filter(Boolean).join(' · ');
  let etaTitle='Pas encore d’estimation',etaDetail='Ajoute plusieurs mesures pour caractériser la tendance.';
  if(Number.isFinite(current)&&current>=target){etaTitle='Cible atteinte';etaDetail=`${fmtTemp(current)} °C mesurés pour ${fmtTemp(target)} °C ciblés.`;}
  else if(a.eta){etaTitle=`~${fmtClock(new Date(a.eta.earliestAtMs))}–${fmtClock(new Date(a.eta.latestAtMs))}`;etaDetail=`Confiance ${a.confidence==='high'?'élevée':a.confidence==='medium'?'moyenne':'faible'}.`;}
  else if(a.quality.key==='stale'){etaTitle='Prévision suspendue';etaDetail='Nouvelle mesure nécessaire pour actualiser l’ETA.';}
  else if(a.reason){etaTitle='Projection incertaine';etaDetail=a.reason;}
  const setpoint=Number.isFinite(a.setpoint)?`${fmtTemp(a.setpoint)} °C`:'—';
  main.innerHTML=`
    <section class="card hero">
      <div class="eyebrow">Cuisson active</div><div class="cook-title">${escapeHtml(c.name)}</div><div class="meta">${escapeHtml(meta||`Démarrée ${fmtDateTime(new Date(c.startTime))}`)}</div>
      <div class="temperature-row"><div class="current-temp">${last?fmtTemp(current):'—'}<small> °C</small></div><div class="target-block"><div class="target-value">${fmtTemp(target)} °C</div><div class="target-label">cible</div></div></div>
      <div class="progress"><div style="width:${pct}%"></div></div>
    </section>
    <section class="stat-grid">
      <div class="stat"><div class="stat-label">Tendance du modèle</div><div class="stat-value">${trendLabel(a.slope)}</div><div class="stat-detail">${Number.isFinite(a.slope)?`${a.slope>=0?'+':''}${fmtTemp(a.slope)} °C/h · ${modelLabel(a.activePhase?.model?.family)}`:'Mesures insuffisantes'}</div></div>
      <div class="stat"><div class="stat-label">15 min après mesure</div><div class="stat-value">${Number.isFinite(a.projection)?`${fmtTemp(a.projection)} °C`:'—'}</div><div class="stat-detail">Projection du régime actif.</div></div>
      <div class="stat"><div class="stat-label">Arrivée cible</div><div class="stat-value">${etaTitle}</div><div class="stat-detail">${etaDetail}</div></div>
      <div class="stat"><div class="stat-label">Qualité</div><div class="stat-value"><span class="quality-dot" style="background:${qualityColor(a.quality.key)}"></span>${a.quality.label}</div><div class="stat-detail">${escapeHtml(a.quality.detail)}</div></div>
    </section>
    ${a.warnings.length?`<section class="card warning" role="status">⚠ ${escapeHtml(a.warnings.join(' · '))}</section>`:''}
    <section class="card"><div class="section-head"><div class="section-title">Courbe</div><button class="section-action" onclick="openMeasurements()">Mesures</button></div><div class="chart-legend"><span class="temp-key">Température</span><button id="velocityToggle" type="button" class="velocity-toggle ${velocityVisible?'active':''}" aria-pressed="${velocityVisible}" onclick="toggleVelocity()"><span class="velocity-key">Vitesse °C/h</span></button></div><div class="chart-wrap"><canvas id="chart" role="img" aria-label="Température du cœur et vitesse historique lissée ; les pointillés relient les portions sans estimation de vitesse"></canvas></div><div class="range-row">${[['1 h',60],['3 h',180],['6 h',360],['Tout',0]].map(([l,v])=>`<button class="chip ${chartRangeMinutes===v?'active':''}" onclick="setChartRange(${v})">${l}</button>`).join('')}</div><div class="chart-note" id="velocityNote"></div></section>
    <section class="card analysis-details"><details><summary>Détails de l’analyse</summary>${analysisDetailsHtml(a)}</details></section>
    <section class="card"><div class="section-head"><div class="section-title">Dernières mesures</div><button class="section-action" onclick="openMeasurements()">Tout voir</button></div>${recentMeasurementsHtml(c)}</section>`;
  requestAnimationFrame(()=>drawChart(c,a));
}
function emptyHtml(){return `<section class="card empty"><div class="empty-icon">🌡️</div><h2>Aucune cuisson active</h2><p>Démarre une cuisson, puis ajoute les températures au fur et à mesure. L’heure est enregistrée automatiquement.</p><button class="primary" onclick="openNewCooking()">Démarrer une cuisson</button><button class="secondary" style="width:100%;margin-top:10px" onclick="openHistory()">Historique et données</button></section>`;}
function modelLabel(f){return {linear:'Linéaire',quadratic:'Quadratique',logarithmic:'Logarithmique',exponential:'Exponentiel'}[f]||'Régime à confirmer';}
function analysisDetailsHtml(a){return `<div>${a.phases.length} phase(s) · régime actif depuis ${a.activePhase?fmtClock(new Date(a.activePhase.startMs)):'—'} · ${a.activePhase?.points.length||0} mesures.</div><table><thead><tr><th>Phase</th><th>Modèle</th><th>RMSE / préd.</th></tr></thead><tbody>${a.phases.map((p,i)=>`<tr><td>${i+1} · ${fmtClock(new Date(p.startMs))}</td><td>${modelLabel(p.model?.family)}</td><td>${p.model?`${fmtNum(p.model.rmseC)} / ${Number.isFinite(p.model.predictiveRmseC)?fmtNum(p.model.predictiveRmseC):'—'} °C`:'—'}</td></tr>`).join('')}</tbody></table><div>Autres modèles : ${a.activePhase?.candidates.map(m=>`${modelLabel(m.family)} (${m.rejectedReason||'retenu'})`).join(' · ')||'—'}</div><div>Intervalle médian ${fmtNum(a.acq.baselineIntervalMinutes,1)} min · âge ${fmtNum(a.acq.ageMinutes,1)} min · grands gaps ${a.acq.gaps.length}.</div>`;}
function recentMeasurementsHtml(c){const ms=[...c.measurements].slice(-5).reverse();if(!ms.length)return `<div class="small">Aucune mesure pour le moment.</div>`;return `<div class="measure-list">${ms.map((m)=>`<div class="measure-item"><div class="measure-time">${fmtClock(new Date(m.timestamp))}</div><div><div class="measure-temp">${fmtTemp(m.temperature)} °C</div>${m.comment?`<div class="small">${escapeHtml(m.comment)}</div>`:''}</div><button class="mini-btn" onclick="editMeasurementByTimestamp('${encodeURIComponent(m.timestamp)}')">Modifier</button></div>`).join('')}</div>`;}

function drawChart(c,a){
  const canvas=document.getElementById('chart');if(!canvas)return;const rect=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const w=rect.width,h=rect.height,ml=42,mb=30;let mt=12,ph=h-mt-mb;ctx.clearRect(0,0,w,h);
  const pts=a.all;if(!pts.length){ctx.fillStyle='#8e8e93';ctx.font='13px -apple-system';ctx.textAlign='center';ctx.fillText('Ajoute une mesure pour afficher la courbe',w/2,h/2);return;}
  const lastTime=pts.at(-1).timeMs,end=lastTime+(Number.isFinite(a.projection)?15*60000:0);let start=chartRangeMinutes?lastTime-chartRangeMinutes*60000:Math.min(new Date(c.startTime).getTime(),pts[0].timeMs);const visible=pts.filter(p=>p.timeMs>=start);if(visible.length===1)start=Math.min(start,visible[0].timeMs-30*60000);
  const history=TemperatureAnalysis.historyCurve(a.phases,a.acq).filter(s=>s.samples.at(-1).timeMs>=start&&s.samples[0].timeMs<=end);
  const rateSegments=velocityVisible?TemperatureAnalysis.rateCurve(a.phases,a.acq).filter(s=>s.samples.at(-1).timeMs>=start&&s.samples[0].timeMs<=end):[];
  const rateValues=rateSegments.flatMap(s=>s.samples.map(p=>p.rateCPerHour));const hasRates=rateValues.length>0;if(hasRates){mt=22;ph=h-mt-mb;}
  const mr=hasRates?49:10,pw=w-ml-mr;
  const note=document.getElementById('velocityNote');if(note)note.textContent=!velocityVisible?'':hasRates?'Vitesse lissée · pointillés : liaison visuelle, vitesse inconnue':'Vitesse indisponible : mesures insuffisantes sur les plages continues.';
  // The oven setpoint is an event/context variable, not a core temperature: never let it flatten the measured curve.
  const temps=visible.map(p=>p.temperature).concat([Number(c.targetTemperature),a.projection]).filter(Number.isFinite);let ymin=Math.min(...temps),ymax=Math.max(...temps);let pad=Math.max(4,(ymax-ymin)*.14);ymin=Math.floor((ymin-pad)/5)*5;ymax=Math.ceil((ymax+pad)/5)*5;if(ymax-ymin<15)ymax=ymin+15;
  const mx=t=>ml+(t-start)/(end-start||1)*pw,my=v=>mt+(ymax-v)/(ymax-ymin)*ph;
  ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1;ctx.fillStyle='#8e8e93';ctx.font='11px -apple-system';ctx.textAlign='right';ctx.textBaseline='middle';for(let i=0;i<=4;i++){const y=mt+ph*i/4,val=ymax-(ymax-ymin)*i/4;ctx.beginPath();ctx.moveTo(ml,y);ctx.lineTo(w-mr,y);ctx.stroke();ctx.fillText(`${Math.round(val)}°`,ml-6,y);}
  let rmin=0,rmax=0,ry;if(hasRates){rmin=Math.min(0,...rateValues);rmax=Math.max(0,...rateValues);const span=Math.max(1,rmax-rmin);rmin=Math.floor((rmin-span*.08)/2)*2;rmax=Math.ceil((rmax+span*.08)/2)*2;ry=v=>mt+(rmax-v)/(rmax-rmin)*ph;ctx.fillStyle='#64d2ff';ctx.textAlign='left';for(let i=0;i<=4;i++){const y=mt+ph*i/4;ctx.fillText(fmtNum(rmax-(rmax-rmin)*i/4,1),w-mr+5,y);}ctx.textAlign='right';ctx.fillText('°C/h',w-2,10);}
  ctx.textAlign='center';ctx.textBaseline='top';for(let i=0;i<=3;i++){const t=start+(end-start)*i/3,x=mx(t);ctx.fillText(fmtClock(new Date(t)),x,h-mb+8);}
  const target=Number(c.targetTemperature);if(Number.isFinite(target)){ctx.save();ctx.setLineDash([6,5]);ctx.strokeStyle='#ff9f0a';ctx.beginPath();ctx.moveTo(ml,my(target));ctx.lineTo(w-mr,my(target));ctx.stroke();ctx.restore();}
  const sp=a.setpoint;if(Number.isFinite(sp)&&sp>=ymin&&sp<=ymax){ctx.save();ctx.setLineDash([3,5]);ctx.strokeStyle='rgba(100,210,255,.6)';ctx.beginPath();ctx.moveTo(ml,my(sp));ctx.lineTo(w-mr,my(sp));ctx.stroke();ctx.restore();}
  for(const e of c.events||[]){const t=new Date(e.timestamp).getTime();if(t<start||t>end)continue;ctx.strokeStyle='rgba(191,90,242,.45)';ctx.beginPath();ctx.moveTo(mx(t),mt);ctx.lineTo(mx(t),mt+ph);ctx.stroke();}
  for(const phase of a.phases.slice(1)){if(phase.startMs<start)continue;ctx.save();ctx.setLineDash([3,5]);ctx.strokeStyle='rgba(255,159,10,.55)';ctx.beginPath();ctx.moveTo(mx(phase.startMs),mt);ctx.lineTo(mx(phase.startMs),mt+ph);ctx.stroke();ctx.restore();}
  ctx.save();ctx.beginPath();ctx.rect(ml,mt,pw,ph);ctx.clip();ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.lineCap='round';for(const s of history){ctx.strokeStyle='#0a84ff';ctx.setLineDash(s.gap?[4,5]:[]);ctx.beginPath();s.samples.forEach((p,i)=>i?ctx.lineTo(mx(p.timeMs),my(p.temperature)):ctx.moveTo(mx(p.timeMs),my(p.temperature)));ctx.stroke();}ctx.setLineDash([]);
  for(const s of history.filter(s=>s.phaseIndex===a.phases.length-1&&!s.boundary)){ctx.strokeStyle='#30d158';ctx.setLineDash(s.gap?[4,5]:[]);ctx.beginPath();s.samples.forEach((p,i)=>i?ctx.lineTo(mx(p.timeMs),my(p.temperature)):ctx.moveTo(mx(p.timeMs),my(p.temperature)));ctx.stroke();}ctx.restore();
  ctx.fillStyle='#f5f5f7';for(const p of visible){ctx.beginPath();ctx.arc(mx(p.timeMs),my(p.temperature),3.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#0a84ff';ctx.lineWidth=2;ctx.stroke();}
  if(Number.isFinite(a.projection)){ctx.save();ctx.setLineDash([4,5]);ctx.strokeStyle='#30d158';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(mx(lastTime),my(pts.at(-1).temperature));ctx.lineTo(mx(lastTime+15*60000),my(a.projection));ctx.stroke();ctx.restore();}
  if(hasRates){ctx.save();ctx.beginPath();ctx.rect(ml,mt,pw,ph);ctx.clip();
    // Link separate estimated runs only for visual continuity. No rate is inferred inside a gap or across a phase boundary.
    ctx.strokeStyle='rgba(100,210,255,.5)';ctx.lineWidth=1.6;ctx.setLineDash([4,6]);
    for(let i=1;i<rateSegments.length;i++){
      const left=rateSegments[i-1].samples.at(-1),right=rateSegments[i].samples[0];
      if(right.timeMs<=left.timeMs)continue;
      ctx.beginPath();ctx.moveTo(mx(left.timeMs),ry(left.rateCPerHour));ctx.lineTo(mx(right.timeMs),ry(right.rateCPerHour));ctx.stroke();
    }
    ctx.setLineDash([]);ctx.strokeStyle='#64d2ff';ctx.lineWidth=2;
    for(const segment of rateSegments){ctx.beginPath();segment.samples.forEach((p,i)=>i?ctx.lineTo(mx(p.timeMs),ry(p.rateCPerHour)):ctx.moveTo(mx(p.timeMs),ry(p.rateCPerHour)));ctx.stroke();}
    const last=rateSegments.at(-1).samples.at(-1);if(last.timeMs===lastTime){ctx.fillStyle='#64d2ff';ctx.beginPath();ctx.arc(mx(last.timeMs),ry(last.rateCPerHour),3,0,Math.PI*2);ctx.fill();}ctx.restore();}
  chartView={start,end,ymin,ymax,rateRange:hasRates?[rmin,rmax]:null};
}
function setChartRange(v){chartRangeMinutes=v;render();}
function toggleVelocity(){velocityVisible=!velocityVisible;const button=document.getElementById('velocityToggle');if(button){button.classList.toggle('active',velocityVisible);button.setAttribute('aria-pressed',String(velocityVisible));}if(state.activeCooking)drawChart(state.activeCooking,analyzeCooking(state.activeCooking));}

function modalHtml(title,body,extra=''){return `<div class="handle"></div><div class="sheet-head"><div class="sheet-title">${title}</div><button class="close" onclick="closeModal()">×</button></div>${body}${extra}`;}
function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open');setTimeout(()=>document.querySelector('#sheet input[autofocus]')?.focus(),80);}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('sheet').innerHTML='';}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800);}

function foodOptions(selected=''){return `<option value="">Non renseigné</option>`+FOOD_GROUPS.map(([g,items])=>`<optgroup label="${g}">${items.map(x=>`<option ${x===selected?'selected':''}>${escapeHtml(x)}</option>`).join('')}</optgroup>`).join('');}
function openNewCooking(){
  const now=new Date();openModal(modalHtml('Nouvelle cuisson',`<form id="newForm">
    <div class="field"><label>Type de viande / plat</label><select id="nfFood">${foodOptions('')}</select></div>
    <div class="field"><label>Nom</label><input id="nfName" value="Cuisson ${fmtDate(now)} ${fmtClock(now)}" autocomplete="off"></div>
    <div class="form-row"><div class="field"><label>Cible (°C)</label><input id="nfTarget" inputmode="decimal" value="${DEFAULT_TARGET_C}"></div><div class="field"><label>Consigne four (°C)</label><input id="nfSetpoint" inputmode="decimal" placeholder="Facultatif"></div></div>
    <div class="form-row"><div class="field"><label>Masse (kg)</label><input id="nfMass" inputmode="decimal" placeholder="Facultatif"></div><div class="field"><label>Épaisseur max. (cm)</label><input id="nfThickness" inputmode="decimal" placeholder="Facultatif"></div></div>
    <div class="error" id="newErr"></div><button class="primary" type="submit">Démarrer la cuisson</button></form>`));
  document.getElementById('nfFood').addEventListener('change',e=>{if(e.target.value&&document.getElementById('nfName').value.startsWith('Cuisson '))document.getElementById('nfName').value=`${e.target.value} — ${fmtDate(now)}`;});
  document.getElementById('newForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('nfName').value.trim(),target=parseTemperature(document.getElementById('nfTarget').value),setpoint=parseOptional(document.getElementById('nfSetpoint').value,0,350),mass=parseOptional(document.getElementById('nfMass').value,.01,100),th=parseOptional(document.getElementById('nfThickness').value,.1,200);if(!name||target===null||setpoint===undefined||mass===undefined||th===undefined){document.getElementById('newErr').textContent='Vérifie les valeurs saisies.';return;}if(state.activeCooking){state.archivedCookings.push({...state.activeCooking,endedAt:localISOString(now),archiveReason:'replaced-by-new-cooking'});}state.activeCooking={id:makeId('cook'),name,startTime:localISOString(now),targetTemperature:target,foodType:document.getElementById('nfFood').value||null,massKg:mass,maxThicknessCm:th,initialCookerSetpointC:setpoint,cookerSetpointC:setpoint,measurements:[],events:[],predictionLog:[]};saveState();closeModal();render();toast('Cuisson démarrée');});
}
function openAddMeasurement(){
  if(!state.activeCooking){openNewCooking();return;}const c=state.activeCooking,last=c.measurements.at(-1);openModal(modalHtml('Ajouter une mesure',`<div class="meta" style="margin-bottom:14px">${last?`Dernière : <strong>${fmtTemp(last.temperature)} °C</strong> à ${fmtClock(new Date(last.timestamp))}`:'Aucune mesure enregistrée'} · cible ${fmtTemp(c.targetTemperature)} °C</div><form id="measureForm"><div class="field"><label>Température mesurée (°C)</label><input id="measureTemp" inputmode="decimal" enterkeyhint="done" autofocus autocomplete="off" placeholder="ex. 76,5"></div><div class="error" id="measureErr"></div><button class="primary" type="submit">Ajouter maintenant</button></form>`));
  document.getElementById('measureForm').addEventListener('submit',e=>{e.preventDefault();const t=parseTemperature(document.getElementById('measureTemp').value);if(t===null){document.getElementById('measureErr').textContent=`Entre une température entre ${MIN_TEMP_C} et ${MAX_TEMP_C} °C.`;return;}c.measurements.push({timestamp:localISOString(new Date()),temperature:t,source:'manual',comment:null});c.measurements.sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));saveState();closeModal();render();toast(`${fmtTemp(t)} °C ajouté`);});
}
function openEvents(){
  if(!state.activeCooking)return;openModal(modalHtml('Ajouter un événement',`<div class="menu-list">${EVENT_TYPES.map(([t,l])=>`<button class="menu-item" onclick="selectEvent('${t}')"><strong>${l}</strong></button>`).join('')}</div>`));
}
function selectEvent(type){const c=state.activeCooking;if(!c)return;const label=EVENT_TYPES.find(x=>x[0]===type)?.[1]||type;if(type==='setpointChanged'){openModal(modalHtml('Nouvelle consigne',`<form id="eventForm"><div class="field"><label>Consigne (°C)</label><input id="eventVal" inputmode="decimal" value="${Number.isFinite(Number(c.cookerSetpointC))?fmtNum(c.cookerSetpointC):''}" autofocus></div><div class="error" id="eventErr"></div><button class="primary" type="submit">Enregistrer</button></form>`));document.getElementById('eventForm').onsubmit=e=>{e.preventDefault();const n=parseOptional(document.getElementById('eventVal').value,0,350);if(n===null||n===undefined){document.getElementById('eventErr').textContent='Consigne invalide.';return;}addEvent(type,`Consigne ${fmtTemp(n)} °C`,{fromC:c.cookerSetpointC,toC:n});c.cookerSetpointC=n;saveState();closeModal();render();toast('Consigne enregistrée');};return;}
  if(type==='wrapped'){openModal(modalHtml('Emballé',`<form id="eventForm"><div class="field"><label>Matériau (facultatif)</label><input id="eventText" placeholder="Aluminium, papier boucher…" autofocus></div><button class="primary" type="submit">Enregistrer</button></form>`));document.getElementById('eventForm').onsubmit=e=>{e.preventDefault();const material=document.getElementById('eventText').value.trim();addEvent(type,material?`Emballé — ${material}`:'Emballé',{material:material||null});closeModal();render();toast('Événement ajouté');};return;}
  if(type==='note'){openModal(modalHtml('Ajouter une note',`<form id="eventForm"><div class="field"><label>Note</label><textarea id="eventText" autofocus placeholder="Retourné, arrosé, changement de position…"></textarea></div><div class="error" id="eventErr"></div><button class="primary" type="submit">Enregistrer</button></form>`));document.getElementById('eventForm').onsubmit=e=>{e.preventDefault();const note=document.getElementById('eventText').value.trim();if(!note){document.getElementById('eventErr').textContent='La note est vide.';return;}addEvent(type,note,{note});closeModal();render();toast('Note ajoutée');};return;}
  addEvent(type,label,{});closeModal();render();toast('Événement ajouté');
}
function addEvent(type,label,details){const c=state.activeCooking,now=new Date();c.events.push({id:makeId(type),timestamp:localISOString(now),type,label,phaseBoundary:PHASE_BOUNDARY_TYPES.has(type),details});c.events.sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));saveState();}

function openMeasurements(){const c=state.activeCooking;if(!c)return;const body=c.measurements.length?`<div class="measure-list">${[...c.measurements].map((m,i)=>({m,i})).reverse().map(({m,i})=>`<div class="measure-item"><div class="measure-time">${fmtClock(new Date(m.timestamp))}<br><span style="font-size:10px">${fmtDate(new Date(m.timestamp))}</span></div><div><div class="measure-temp">${fmtTemp(m.temperature)} °C</div>${m.comment?`<div class="small">${escapeHtml(m.comment)}</div>`:''}</div><button class="mini-btn" onclick="openEditMeasurement(${i})">Modifier</button></div>`).join('')}</div>`:`<div class="small">Aucune mesure.</div>`;openModal(modalHtml('Mesures',body));}
function editMeasurementByTimestamp(encoded){const ts=decodeURIComponent(encoded),i=state.activeCooking?.measurements.findIndex(m=>m.timestamp===ts);if(i>=0)openEditMeasurement(i);}
function openEditMeasurement(i){const c=state.activeCooking,m=c?.measurements[i];if(!m)return;openModal(modalHtml('Modifier la mesure',`<form id="editMeasureForm"><div class="field"><label>Température (°C)</label><input id="editTemp" inputmode="decimal" value="${fmtNum(m.temperature)}" autofocus></div><div class="field"><label>Date et heure</label><input id="editTime" type="datetime-local" value="${toDatetimeLocal(m.timestamp)}"></div><div class="field"><label>Commentaire</label><input id="editComment" value="${escapeHtml(m.comment||'')}" placeholder="Facultatif"></div><div class="error" id="editErr"></div><div class="actions"><button type="button" class="secondary danger" id="deleteMeasure">Supprimer</button><button class="primary" type="submit">Enregistrer</button></div></form>`));document.getElementById('editMeasureForm').onsubmit=e=>{e.preventDefault();const t=parseTemperature(document.getElementById('editTemp').value),ts=fromDatetimeLocal(document.getElementById('editTime').value);if(t===null||!ts){document.getElementById('editErr').textContent='Valeur ou date invalide.';return;}m.temperature=t;m.timestamp=ts;m.comment=document.getElementById('editComment').value.trim()||null;c.measurements.sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));saveState();closeModal();render();toast('Mesure modifiée');};document.getElementById('deleteMeasure').onclick=()=>{if(confirm(`Supprimer ${fmtTemp(m.temperature)} °C à ${fmtClock(new Date(m.timestamp))} ?`)){c.measurements.splice(i,1);saveState();closeModal();render();toast('Mesure supprimée');}};}

function openMore(){if(!state.activeCooking)return;openModal(modalHtml('Plus',`<div class="menu-list">
  <button class="menu-item" onclick="openParameters()"><strong>Paramètres de cuisson</strong><span>Cible, consigne, masse, épaisseur…</span></button>
  <button class="menu-item" onclick="openMeasurements()"><strong>Modifier les mesures</strong><span>Température, heure ou suppression.</span></button>
  <button class="menu-item" onclick="exportCookingJson(state.activeCooking)"><strong>Exporter cette cuisson</strong><span>JSON compatible et CSV.</span></button>
  <button class="menu-item" onclick="finishCooking()"><strong>Terminer et archiver</strong><span>Conserve la cuisson dans l’historique.</span></button>
  <button class="menu-item" onclick="openHistory()"><strong>Historique et données</strong><span>Sauvegarde, import, anciennes cuissons.</span></button>
</div>`));}
function openParameters(){const c=state.activeCooking;if(!c)return;openModal(modalHtml('Paramètres',`<form id="paramForm"><div class="field"><label>Nom</label><input id="pName" value="${escapeHtml(c.name)}"></div><div class="field"><label>Type de viande / plat</label><select id="pFood">${foodOptions(c.foodType||'')}</select></div><div class="form-row"><div class="field"><label>Cible (°C)</label><input id="pTarget" inputmode="decimal" value="${fmtNum(c.targetTemperature)}"></div><div class="field"><label>Consigne (°C)</label><input id="pSetpoint" inputmode="decimal" value="${fmtNum(c.cookerSetpointC)}"></div></div><div class="form-row"><div class="field"><label>Masse (kg)</label><input id="pMass" inputmode="decimal" value="${fmtNum(c.massKg)}"></div><div class="field"><label>Épaisseur (cm)</label><input id="pThickness" inputmode="decimal" value="${fmtNum(c.maxThicknessCm)}"></div></div><div class="error" id="paramErr"></div><button class="primary" type="submit">Enregistrer</button></form>`));document.getElementById('paramForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('pName').value.trim(),target=parseTemperature(document.getElementById('pTarget').value),sp=parseOptional(document.getElementById('pSetpoint').value,0,350),mass=parseOptional(document.getElementById('pMass').value,.01,100),th=parseOptional(document.getElementById('pThickness').value,.1,200);if(!name||target===null||sp===undefined||mass===undefined||th===undefined){document.getElementById('paramErr').textContent='Vérifie les valeurs.';return;}const old=c.cookerSetpointC;c.name=name;c.targetTemperature=target;c.foodType=document.getElementById('pFood').value||null;c.massKg=mass;c.maxThicknessCm=th;if(c.measurements.length&&sp!==null&&Number(old)!==Number(sp)){addEvent('setpointChanged',`Consigne ${fmtTemp(sp)} °C`,{fromC:old,toC:sp,source:'parameters-edit'});}c.cookerSetpointC=sp;if(!c.measurements.length)c.initialCookerSetpointC=sp;saveState();closeModal();render();toast('Paramètres enregistrés');};}
function finishCooking(){const c=state.activeCooking;if(!c)return;if(!confirm(`Terminer « ${c.name} » et l’archiver ?`))return;state.archivedCookings.push({...c,endedAt:localISOString(new Date()),archiveReason:'completed'});state.activeCooking=null;saveState();closeModal();render();toast('Cuisson archivée');}

function openHistory(){const items=[...state.archivedCookings].map((c,i)=>({c,i})).reverse();openModal(modalHtml('Historique et données',`
  <div class="actions" style="margin-top:0"><button class="secondary" onclick="exportState()">Sauvegarder JSON</button><button class="secondary" onclick="document.getElementById('fileInput').click()">Importer JSON</button></div>
  <div class="hint">Les données sont stockées localement dans Safari/PWA sur cet appareil. Une sauvegarde JSON périodique est recommandée.</div><div class="sep"></div>
  ${items.length?items.map(({c,i})=>`<div class="history-item"><div class="history-top"><div><div class="history-title">${escapeHtml(c.name)}</div><div class="history-sub">${fmtDate(new Date(c.startTime))} · ${c.measurements?.length||0} mesures · cible ${fmtTemp(c.targetTemperature)} °C</div></div><div class="small">${c.endedAt?fmtClock(new Date(c.endedAt)):''}</div></div><div class="history-actions"><button class="mini-btn" onclick="exportCookingJson(state.archivedCookings[${i}])">Exporter</button><button class="mini-btn" onclick="restoreArchived(${i})">Réactiver</button><button class="mini-btn danger" onclick="deleteArchived(${i})">Supprimer</button></div></div>`).join(''):`<div class="small">Aucune cuisson archivée.</div>`}
  <div class="sep"></div><button class="secondary danger" style="width:100%" onclick="resetAllData()">Effacer toutes les données</button><div class="hint">CuissonTracker Web ${APP_VERSION} · schéma ${SCHEMA_VERSION}</div>`));}
function restoreArchived(i){const c=state.archivedCookings[i];if(!c)return;if(state.activeCooking&&!confirm('La cuisson active sera archivée. Continuer ?'))return;if(state.activeCooking)state.archivedCookings.push({...state.activeCooking,endedAt:localISOString(new Date()),archiveReason:'replaced-by-restored-cooking'});state.archivedCookings.splice(i,1);state.activeCooking={...c,endedAt:undefined,archiveReason:undefined};saveState();closeModal();render();toast('Cuisson réactivée');}
function deleteArchived(i){const c=state.archivedCookings[i];if(c&&confirm(`Supprimer définitivement « ${c.name} » ?`)){state.archivedCookings.splice(i,1);saveState();openHistory();}}
function resetAllData(){if(confirm('Effacer toutes les cuissons et mesures de cet appareil ? Cette action est irréversible sans sauvegarde JSON.')){state=emptyState();saveState();closeModal();render();toast('Données effacées');}}

function stateExportPayload(){return {...state,exportedAt:localISOString(new Date()),appVersion:APP_VERSION};}
async function shareOrDownload(text,filename,mime='application/json'){
  const blob=new Blob([text],{type:mime});const file=new File([blob],filename,{type:mime});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return;}}catch(e){if(e.name==='AbortError')return;}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportState(){shareOrDownload(JSON.stringify(stateExportPayload(),null,2),`cuisson-tracker-backup-${new Date().toISOString().slice(0,10)}.json`);}
function exportCookingJson(c){if(!c)return;closeModal();openModal(modalHtml('Exporter la cuisson',`<div class="menu-list"><button class="menu-item" onclick="downloadCookingJson()"><strong>JSON</strong><span>Toutes les données de la cuisson.</span></button><button class="menu-item" onclick="downloadCookingCsv()"><strong>CSV</strong><span>Mesures exploitables dans Excel, Python ou MATLAB.</span></button></div>`));window._exportCooking=c;}
function downloadCookingJson(){const c=window._exportCooking;if(!c)return;shareOrDownload(JSON.stringify({schemaVersion:SCHEMA_VERSION,analysisVersion:ANALYSIS_VERSION,exportedAt:localISOString(new Date()),cooking:c,currentAnalysis:analyzeCooking(c)},null,2),`${safeName(c.name)}.json`);}
function downloadCookingCsv(){const c=window._exportCooking;if(!c)return;const start=new Date(c.startTime).getTime();const rows=[['timestamp','elapsed_min','temperature_C','comment']];for(const m of c.measurements||[])rows.push([m.timestamp,((new Date(m.timestamp).getTime()-start)/60000).toFixed(3),m.temperature,m.comment||'']);const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');shareOrDownload(csv,`${safeName(c.name)}.csv`,'text/csv;charset=utf-8');}

document.getElementById('fileInput').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;try{const data=JSON.parse(await f.text());let incoming;if(data.activeCooking!==undefined||data.archivedCookings!==undefined)incoming=migrateState(data);else if(data.cooking){incoming=emptyState();incoming.archivedCookings=[data.cooking];incoming=migrateState(incoming);}else throw new Error('Format non reconnu');if(!confirm('Importer ce fichier remplacera les données locales actuelles. Continuer ?'))return;state=incoming;saveState();closeModal();render();toast('Import terminé');}catch(err){alert(`Import impossible : ${err.message}`);}});

// Main controls
 document.getElementById('addBtn').onclick=openAddMeasurement;
 document.getElementById('eventBtn').onclick=openEvents;
 document.getElementById('moreBtn').onclick=openMore;
 document.getElementById('historyTopBtn').onclick=openHistory;
 window.addEventListener('resize',()=>{if(state.activeCooking)requestAnimationFrame(()=>drawChart(state.activeCooking,analyzeCooking(state.activeCooking)));});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.activeCooking)render();});

// Quick-add URL: index.html?action=quickadd
 render();
 const params=new URLSearchParams(location.search);if(params.get('action')==='quickadd')setTimeout(openAddMeasurement,120);

// PWA offline cache
 if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
</script>
</body>
</html>
